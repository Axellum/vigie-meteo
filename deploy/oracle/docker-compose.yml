# Stack Docker optimisée pour Oracle Cloud Always Free (Ampere A1 : 2 OCPU ARM64, 12 Go RAM).
# Démarre :
# 1. open-meteo-sync : synchronise uniquement AROME HD + ARPEGE Europe (France)
# 2. open-meteo      : moteur API Open-Meteo local (4 Go de cache RAM)
# 3. meteo-api       : facade FastAPI unifiée sur le port 8000 (accessible via WireGuard 192.168.27.65:8000)
# 4. et 5., profil « monde » seulement (COMPOSE_PROFILES=monde) : Open-Meteo pour le monde entier sur un disque à part
#    (open-meteo-world-sync + open-meteo-world, port 8081). Voir « Open-Meteo pour le monde » dans le README.

volumes:
  open_meteo_data:
  meteo_api_data:

x-om-env: &om-env
  LOG_LEVEL: info
  CACHE_SIZE: 4GB

services:
  open-meteo-sync:
    image: ghcr.io/open-meteo/open-meteo:latest
    container_name: open-meteo-sync
    restart: unless-stopped
    environment:
      <<: *om-env
    volumes:
      - open_meteo_data:/app/data
    # Synchronisation ciblée Météo-France (AROME HD 1,5 km + 15 min, ARPEGE Europe 11 km, MFWAM vagues, courants et SST)
    # --concurrent 1 pour préserver les 2 OCPU et le disque Oracle
    command: >
      sync meteofrance_arome_france_hd,meteofrance_arome_france_hd_15min,meteofrance_arpege_europe,meteofrance_wave,meteofrance_currents,meteofrance_sea_surface_temperature
      temperature_2m,apparent_temperature,relative_humidity_2m,precipitation,precipitation_probability,wind_speed_10m,wind_gusts_10m,wind_direction_10m,wind_u_component_10m,wind_v_component_10m,cloud_cover,cloud_cover_low,cloud_cover_mid,cloud_cover_high,surface_pressure,pressure_msl,uv_index,shortwave_radiation,weather_code,snowfall_water_equivalent,cape,wave_height,wave_direction,wave_period,swell_wave_height,swell_wave_direction,swell_wave_period,secondary_swell_wave_height,secondary_swell_wave_direction,secondary_swell_wave_period,wind_wave_height,wind_wave_direction,wind_wave_period,ocean_u_current,ocean_v_current,sea_surface_temperature
      --past-days 2 --repeat-interval 60 --concurrent 1
    deploy:
      resources:
        limits:
          memory: 2G

  open-meteo:
    image: ghcr.io/open-meteo/open-meteo:latest
    container_name: open-meteo-api
    restart: unless-stopped
    user: "0"
    environment:
      <<: *om-env
    volumes:
      - open_meteo_data:/app/data
    command: ["serve", "--env", "production", "--hostname", "0.0.0.0", "--port", "8080"]
    # Sur Oracle, la chaîne DOCKER-USER bloque l'interface publique et autorise WireGuard (wg0)
    ports:
      - "8080:8080"
    # La limite compte le cache disque. om_prechauffer.sh (toutes les 15 min) y garde la météo lue par Vigie (AROME HD, ses
    # quarts d'heure, ARPEGE : ~5 Go) : 40 points neufs en 8 ms de médiane au lieu de 293 ms (24/11/2026). 12 Go laissent
    # de la place au reste (mer, passé).
    deploy:
      resources:
        limits:
          memory: 12G

  # --- Open-Meteo pour le monde entier (profil « monde ») ---------------------------------------------------------
  # Données sur un disque à part, monté sur OM_WORLD_DATA (200 Go depuis le 24/11/2026, ~80 Go utilisés) : jamais sur
  # le disque de démarrage. Les fichiers fixes (relief 90 m, grilles d'ICON) viennent de monde_fichiers_fixes.sh, pas de
  # la synchro. Modèles gardés après mesure contre 49 aéroports : ECMWF IFS 9 km, GFS, probabilités GEFS et ECMWF, CAMS,
  # ICON Europe et D2, et les régionaux HRRR, HRDPS, JMA, DMI, KNMI, MeteoSwiss (0,99 °C d'écart moyen, comme le jeu
  # complet ; 0,97 °C pour l'API publique). ICON monde, UKMO monde et ARPEGE monde n'apportaient rien (35 Go de moins).
  open-meteo-world-sync:
    image: ghcr.io/open-meteo/open-meteo:latest
    container_name: open-meteo-world-sync
    profiles: ["monde"]
    restart: unless-stopped
    environment:
      LOG_LEVEL: info
      CACHE_SIZE: 2GB
    volumes:
      - ${OM_WORLD_DATA:-/mnt/om-monde/data}:/app/data
    # Variables triées le 24/11/2026 par un essai champ par champ des requêtes de Vigie (104 points, API d'essai où une
    # variable est masquée, comparée à la production) : lifted_index et uv_index_clear_sky ne changeaient rien, retirés.
    # direct_radiation et diffuse_radiation restent : ICON Europe et D2 calculent le rayonnement global avec les deux.
    # cape, convective_inhibition et visibility servent au code du temps (orages, brouillard).
    # ECMWF IFS 9 km et GFS 0,11° (les trois quarts du volume) ont leur propre synchro, juste après.
    # --concurrent 1 ici et 1 là-bas : 2 téléchargements à la fois comme avant, le disque plafonne vers 50 Mo/s.
    command: >
      sync ncep_gfs025,ncep_gefs025,ecmwf_ifs025_ensemble,cams_global,cams_europe,dwd_icon_eu,dwd_icon_d2,ncep_hrrr_conus,cmc_gem_hrdps,jma_msm,jma_gsm,dmi_harmonie_arome_europe,knmi_harmonie_arome_europe,meteoswiss_icon_ch1
      temperature_2m,apparent_temperature,relative_humidity_2m,dew_point_2m,pressure_msl,surface_pressure,wind_speed_10m,wind_direction_10m,wind_u_component_10m,wind_v_component_10m,wind_gusts_10m,precipitation,rain,showers,snowfall,snowfall_water_equivalent,weather_code,uv_index,cloud_cover,cloud_cover_low,cloud_cover_mid,cloud_cover_high,shortwave_radiation,direct_radiation,diffuse_radiation,cape,convective_inhibition,precipitation_probability,visibility,is_day,sunshine_duration,frozen_precipitation_percent,pm10,pm2_5,ozone,nitrogen_dioxide,sulphur_dioxide,carbon_monoxide,dust,aerosol_optical_depth,european_aqi,us_aqi
      --past-days 2 --repeat-interval 60 --concurrent 1
    deploy:
      resources:
        limits:
          memory: 4G

  # ECMWF IFS 9 km et GFS 0,11° à part : sans le rayonnement direct d'ECMWF (2,6 Go) ni le diffus de GFS 0,11° (1,8 Go),
  # que Vigie n'utilise pas (même essai : aucune valeur changée sans eux), alors qu'ICON a besoin des deux.
  # GFS 0,11° reste indispensable : sans lui, plus d'UV ni de températures max/min sur 83 % des jours (même essai).
  open-meteo-world-sync-lourds:
    image: ghcr.io/open-meteo/open-meteo:latest
    container_name: open-meteo-world-sync-lourds
    profiles: ["monde"]
    restart: unless-stopped
    environment:
      LOG_LEVEL: info
      CACHE_SIZE: 2GB
    volumes:
      - ${OM_WORLD_DATA:-/mnt/om-monde/data}:/app/data
    command: >
      sync ecmwf_ifs,ncep_gfs013
      temperature_2m,apparent_temperature,relative_humidity_2m,dew_point_2m,pressure_msl,surface_pressure,wind_speed_10m,wind_direction_10m,wind_u_component_10m,wind_v_component_10m,wind_gusts_10m,precipitation,rain,showers,snowfall,snowfall_water_equivalent,weather_code,uv_index,cloud_cover,cloud_cover_low,cloud_cover_mid,cloud_cover_high,shortwave_radiation,cape,convective_inhibition,precipitation_probability,visibility,is_day,frozen_precipitation_percent
      --past-days 2 --repeat-interval 60 --concurrent 1
    deploy:
      resources:
        limits:
          memory: 4G

  open-meteo-world:
    image: ghcr.io/open-meteo/open-meteo:latest
    container_name: open-meteo-world
    profiles: ["monde"]
    restart: unless-stopped
    user: "0"
    environment:
      LOG_LEVEL: info
      CACHE_SIZE: 4GB
    volumes:
      - ${OM_WORLD_DATA:-/mnt/om-monde/data}:/app/data:ro
    command: ["serve", "--env", "production", "--hostname", "0.0.0.0", "--port", "8080"]
    # Lu par Vigie (prévisions hors de France et qualité de l'air), par WireGuard seulement : DOCKER-USER bloque
    # l'interface publique.
    ports:
      - "8081:8080"
    # La limite compte aussi le cache disque : à 5 Go, 11 à 56 req/s (lecture du disque) ; à 14 Go, 840 req/s
    # (mesuré le 22/11/2026 sur 2 000 points au hasard). 4,5 Go de cache suffisent pour 2 000 points.
    deploy:
      resources:
        limits:
          memory: 12G

  meteo-api:
    build:
      context: ../..
      dockerfile: Dockerfile
    container_name: meteo-france-api
    restart: unless-stopped
    depends_on:
      - open-meteo
    env_file:
      - ../../.env
    environment:
      METEO_DB_PATH: /data/meteo_cache.db
      OPEN_METEO_BASE_URL: http://open-meteo:8080
      # glibc garde sinon les cartes PIAF libérées (480 Mo par processus mesurés le 17/11/2026 au lieu de ~175) :
      # au-delà de 1 Mo, un bloc est alloué par mmap et rendu au système dès qu'il est libéré.
      MALLOC_MMAP_THRESHOLD_: "1048576"
      MALLOC_ARENA_MAX: "2"
    volumes:
      - meteo_api_data:/data
    # Sur Oracle, la chaîne DOCKER-USER bloque l'interface publique et autorise WireGuard (wg0)
    ports:
      - "8000:8000"
    # PIAF : 125 Mo de carte par processus (2), pic mesuré 178 Mo pendant un chargement (17/11/2026). 724 Mo utilisés le
    # 24/11/2026 : 2 Go laissent de la marge (et la place d'un cache de tuiles).
    deploy:
      resources:
        limits:
          memory: 2G
